<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalibr 批量自动标定台</title>
  <style>
    :root {
      --bg: #f6eeee;
      --bg-grad: radial-gradient(1200px 600px at 12% -8%, #fbe6e4 0%, transparent 55%),
                 radial-gradient(1000px 520px at 100% 0%, #f7e0dd 0%, transparent 50%),
                 #f6eeee;
      --surface: #ffffff;
      --surface-2: #fbf5f5;
      --ink: #2a1a1a;
      --muted: #8a6f6f;
      --line: #ecdada;
      --line-soft: #f3e5e5;
      --red: #b3261e;
      --red-dark: #7f130d;
      --red-mid: #8f1a14;
      --red-soft: rgba(179, 38, 30, 0.1);
      --amber: #b06a00;
      --amber-bg: #fff2d2;
      --green: #1b7f4b;
      --green-bg: #e3f5ec;
      --red-bg: #fde8e6;
      --shadow: 0 14px 40px rgba(90, 20, 20, 0.12);
      --shadow-sm: 0 4px 14px rgba(90, 20, 20, 0.08);
      --radius: 14px;
      --radius-sm: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg-grad); background-attachment: fixed;
      color: var(--ink); font-family: "Segoe UI", Arial, "Microsoft YaHei", sans-serif;
      font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased;
    }
    header {
      border-bottom: 1px solid var(--line);
      background: linear-gradient(120deg, #b3261e 0%, #8f1a14 52%, #5c0f0b 100%);
      color: #fff; box-shadow: 0 6px 24px rgba(120, 20, 20, 0.22);
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      width: min(1500px, calc(100% - 32px)); margin: 0 auto; padding: 20px 0;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark {
      display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px;
      background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.28); font-size: 22px;
    }
    h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: .2px; }
    .subtitle { margin-top: 3px; color: rgba(255,255,255,0.85); font-size: 13px; }
    .server-pill {
      display: inline-flex; align-items: center; gap: 8px; min-height: 34px;
      border: 1px solid rgba(255,255,255,0.3); border-radius: 999px; padding: 6px 14px;
      background: rgba(255,255,255,0.14); color: #fff; white-space: nowrap;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #7ef0a8;
      box-shadow: 0 0 0 4px rgba(126,240,168,0.25); }
    .dot.off { background: #ffd27e; box-shadow: 0 0 0 4px rgba(255,210,126,0.25); }
    main {
      width: min(1500px, calc(100% - 32px)); margin: 22px auto 40px;
      display: grid; grid-template-columns: minmax(380px, 460px) 1fr; gap: 20px; align-items: start;
    }
    @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow-sm); padding: 18px 18px 20px;
    }
    .card + .card { margin-top: 18px; }
    .card h2 { margin: 0 0 4px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .card .hint { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
    .section-tag {
      display: inline-block; font-size: 11px; font-weight: 700; color: var(--red);
      background: var(--red-soft); border-radius: 6px; padding: 2px 8px; margin-bottom: 8px;
    }
    .folder-list { max-height: 300px; overflow: auto; border: 1px solid var(--line-soft);
      border-radius: var(--radius-sm); }
    .folder-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px;
      border-bottom: 1px solid var(--line-soft); cursor: pointer;
    }
    .folder-item:last-child { border-bottom: none; }
    .folder-item:hover { background: var(--surface-2); }
    .folder-item input { accent-color: var(--red); width: 16px; height: 16px; }
    .folder-name { font-weight: 600; }
    .folder-meta { margin-left: auto; display: flex; gap: 6px; }
    .chip {
      font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line);
      color: var(--muted); background: var(--surface-2); white-space: nowrap;
    }
    .chip.ok { color: var(--green); background: var(--green-bg); border-color: #bfe6cf; }
    .chip.warn { color: var(--amber); background: var(--amber-bg); border-color: #ecd9a8; }
    .chip.res { color: var(--red); background: var(--red-soft); border-color: #edc9c6; cursor: pointer; }
    .toolbar { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
    .btn {
      appearance: none; border: 1px solid var(--red); background: var(--red); color: #fff;
      border-radius: var(--radius-sm); padding: 9px 16px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: .15s; font-family: inherit;
    }
    .btn:hover { background: var(--red-dark); border-color: var(--red-dark); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.ghost { background: transparent; color: var(--red); }
    .btn.ghost:hover { background: var(--red-soft); }
    .btn.sm { padding: 5px 10px; font-size: 12.5px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
    .field input, .field select {
      border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 13px;
      font-family: inherit; background: #fff; color: var(--ink);
    }
    .field input:focus, .field select:focus { outline: 2px solid var(--red-soft); border-color: var(--red); }
    .field .tip { font-size: 11px; color: var(--muted); }
    details.adv { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
    details.adv summary { cursor: pointer; font-weight: 600; color: var(--red); font-size: 13px; }
    .job {
      border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 12px;
      background: var(--surface-2);
    }
    .job-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
    .badge.queued { color: var(--muted); background: #eee; }
    .badge.running { color: var(--red); background: var(--red-soft); }
    .badge.passed { color: var(--green); background: var(--green-bg); }
    .badge.failed { color: var(--red-dark); background: var(--red-bg); }
    .badge.canceled { color: var(--amber); background: var(--amber-bg); }
    .job-folders { color: var(--muted); font-size: 12.5px; }
    .log {
      margin-top: 10px; background: #1c1414; color: #f0e0dd; border-radius: 8px; padding: 10px 12px;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12px;
      max-height: 460px; overflow: auto; white-space: pre-wrap; word-break: break-word;
    }
    .result-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .empty { color: var(--muted); text-align: center; padding: 24px 0; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">🎯</div>
        <div>
          <h1>Kalibr 批量自动标定台</h1>
          <div class="subtitle">四目鱼眼 + IMU · 单个 / 批量标定 · 结果可视化</div>
        </div>
      </div>
      <div class="server-pill">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">检查容器…</span>
      </div>
    </div>
  </header>

  <main>
    <!-- 左栏: 选择 + 参数 -->
    <div>
      <div class="card">
        <span class="section-tag">数据源</span>
        <h2>📁 选择数据文件夹</h2>
        <p class="hint">列出容器 <code id="dataRootTxt">/data</code> 下含 <code>calibration.bag</code> 的文件夹。勾选后可单个或批量标定。</p>
        <div class="row-between" style="margin-bottom:8px">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
            <input type="checkbox" id="selectAll" style="accent-color:var(--red);width:16px;height:16px"> 全选
          </label>
          <button class="btn ghost sm" id="refreshBtn">↻ 刷新</button>
        </div>
        <div class="folder-list" id="folderList"><div class="empty">加载中…</div></div>
      </div>

      <div class="card">
        <span class="section-tag">标定参数</span>
        <h2>⚙️ 参数配置</h2>
        <p class="hint">留空即用 run_one.sh 默认值。</p>
        <div class="form-grid">
          <div class="field">
            <label>CAM_HZ 相机抽帧频率</label>
            <input id="CAM_HZ" placeholder="0 = 全帧" value="">
            <span class="tip">0 保留全帧, 利于多目共视</span>
          </div>
          <div class="field">
            <label>BAG_FREQ 处理频率</label>
            <input id="BAG_FREQ" placeholder="10" value="">
          </div>
          <div class="field">
            <label>IMU_SAFETY 噪声放大</label>
            <input id="IMU_SAFETY" placeholder="1.0" value="">
            <span class="tip">工程常用 5~10</span>
          </div>
          <div class="field">
            <label>IMU_TOPIC</label>
            <input id="IMU_TOPIC" placeholder="/imu_data_raw" value="">
          </div>
          <div class="field full">
            <label>MODELS 四目相机模型</label>
            <select id="MODELS">
              <option value="">默认 (omni-radtan ×4)</option>
              <option value="omni-radtan omni-radtan omni-radtan omni-radtan">omni-radtan ×4</option>
              <option value="eucm-none eucm-none eucm-none eucm-none">eucm-none ×4 (鱼眼 160°+)</option>
              <option value="ds-none ds-none ds-none ds-none">ds-none ×4 (超大 FoV)</option>
              <option value="pinhole-radtan pinhole-radtan pinhole-radtan pinhole-radtan">pinhole-radtan ×4</option>
            </select>
          </div>
          <div class="field">
            <label>TARGET_NAME 标定板</label>
            <select id="TARGET_NAME">
              <option value="">默认 (checkerboard.yaml)</option>
              <option value="checkerboard.yaml">checkerboard.yaml</option>
              <option value="aprilgrid.yaml">aprilgrid.yaml</option>
            </select>
          </div>
          <div class="field">
            <label>REPROJ_WARN 告警阈值(px)</label>
            <input id="REPROJ_WARN" placeholder="1.0" value="">
          </div>
        </div>
        <details class="adv">
          <summary>更多参数</summary>
          <div class="form-grid" style="margin-top:10px">
            <div class="field"><label>IMU_RATE</label><input id="IMU_RATE" placeholder="200"></div>
            <div class="field"><label>PLAY_RATE</label><input id="PLAY_RATE" placeholder="50"></div>
            <div class="field"><label>RESULT_KEEP 保留次数</label><input id="RESULT_KEEP" placeholder="3"></div>
            <div class="field">
              <label>KEEP_CONVERTED</label>
              <select id="KEEP_CONVERTED"><option value="">否</option><option value="1">是 (保留转换后bag)</option></select>
            </div>
          </div>
        </details>
        <div class="toolbar" style="margin-top:16px">
          <button class="btn" id="calibSingleBtn">▶ 标定选中项 (逐个)</button>
          <button class="btn ghost" id="calibBatchBtn">▶▶ 批量标定选中项</button>
        </div>
        <p class="hint" id="selCount" style="margin:0">已选 0 个文件夹</p>
      </div>
    </div>

    <!-- 右栏: 任务 -->
    <div class="card">
      <span class="section-tag">运行状态</span>
      <h2>🗂️ 标定任务</h2>
      <p class="hint">任务在容器 <code id="containerTxt">kalibr_work</code> 内串行执行, 实时回显日志; 完成后可查看结果可视化。</p>
      <div id="jobs"><div class="empty">暂无任务</div></div>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let folders = [];
    let pollTimers = {};

    async function api(path, opts) {
      const r = await fetch(path, opts);
      return r.json();
    }

    async function loadConfig() {
      try {
        const c = await api('/api/config');
        $('dataRootTxt').textContent = c.data_root || '/data';
        $('containerTxt').textContent = c.container || 'kalibr_work';
        if (c.running) {
          $('statusDot').className = 'dot';
          $('statusText').textContent = '容器 ' + c.container + ' 运行中';
        } else {
          $('statusDot').className = 'dot off';
          $('statusText').textContent = '容器 ' + c.container + ' 未运行';
        }
      } catch (e) {
        $('statusText').textContent = '服务连接失败';
        $('statusDot').className = 'dot off';
      }
    }

    async function loadFolders() {
      $('folderList').innerHTML = '<div class="empty">加载中…</div>';
      const data = await api('/api/folders');
      if (data.error) {
        $('folderList').innerHTML = '<div class="empty">' + data.error + '</div>';
        folders = []; updateSelCount(); return;
      }
      folders = data.folders || [];
      renderFolders();
    }

    function renderFolders() {
      if (!folders.length) {
        $('folderList').innerHTML = '<div class="empty">没有找到含 calibration.bag 的文件夹</div>';
        updateSelCount(); return;
      }
      $('folderList').innerHTML = folders.map((f, i) => {
        const imu = f.has_imu
          ? '<span class="chip ok">imu.bag</span>'
          : '<span class="chip warn">缺 imu.bag</span>';
        const res = (f.results && f.results.length)
          ? '<span class="chip res" data-folder="' + f.name + '" data-which="' + f.results[f.results.length-1] + '">已标定 · 查看</span>'
          : '';
        return '<label class="folder-item">' +
          '<input type="checkbox" class="fchk" value="' + f.name + '">' +
          '<span class="folder-name">' + f.name + '</span>' +
          '<span class="folder-meta">' + imu + res + '</span></label>';
      }).join('');
      document.querySelectorAll('.fchk').forEach(c =>
        c.addEventListener('change', updateSelCount));
      document.querySelectorAll('.chip.res').forEach(c =>
        c.addEventListener('click', (e) => {
          e.preventDefault(); e.stopPropagation();
          const f = c.getAttribute('data-folder'), w = c.getAttribute('data-which');
          window.open('/viz.html?folder=' + encodeURIComponent(f) + '&which=' + encodeURIComponent(w), '_blank');
        }));
      updateSelCount();
    }

    function selectedFolders() {
      return Array.from(document.querySelectorAll('.fchk:checked')).map(c => c.value);
    }
    function updateSelCount() {
      $('selCount').textContent = '已选 ' + selectedFolders().length + ' 个文件夹';
    }

    function collectEnv() {
      const keys = ['CAM_HZ','BAG_FREQ','IMU_RATE','IMU_SAFETY','IMU_TOPIC','MODELS',
                    'TARGET_NAME','PLAY_RATE','KEEP_CONVERTED','REPROJ_WARN','RESULT_KEEP'];
      const env = {};
      keys.forEach(k => { const el = $(k); if (el && el.value.trim() !== '') env[k] = el.value.trim(); });
      return env;
    }

    async function createJob(sel) {
      if (!sel.length) { alert('请先勾选至少一个文件夹'); return; }
      const missing = sel.filter(n => { const f = folders.find(x => x.name === n); return f && !f.has_imu; });
      if (missing.length && !confirm('以下文件夹缺少 imu.bag, 标定可能失败:\n' + missing.join(', ') + '\n仍要继续?')) return;
      const job = await api('/api/jobs', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({folders: sel, env: collectEnv()}),
      });
      if (job.error) { alert(job.error); return; }
      pollJob(job.job_id);
    }

    function badge(status) {
      const map = {queued:'排队', running:'标定中', passed:'成功', failed:'失败', canceled:'已取消'};
      return '<span class="badge ' + status + '">' + (map[status] || status) + '</span>';
    }

    function renderJobs(jobs) {
      if (!jobs.length) { $('jobs').innerHTML = '<div class="empty">暂无任务</div>'; return; }
      const container = $('jobs');
      if (container.querySelector('.empty')) container.innerHTML = '';
      // 移除已消失的任务卡
      const ids = new Set(jobs.map(j => j.job_id));
      Array.from(container.children).forEach(el => {
        if (el.dataset.job && !ids.has(el.dataset.job)) el.remove();
      });
      jobs.forEach(j => {
        let card = container.querySelector('[data-job="' + j.job_id + '"]');
        if (!card) {
          card = document.createElement('div');
          card.className = 'job';
          card.dataset.job = j.job_id;
          card.innerHTML =
            '<div class="job-head"></div>' +
            '<div class="result-links" data-links></div>' +
            '<div class="log" data-log></div>';
          container.appendChild(card);
        }
        updateJobCard(card, j);
      });
    }

    function updateJobCard(card, j) {
      const running = (j.status === 'running' || j.status === 'queued');
      const cur = j.current ? ('<span class="job-folders">当前: <b>' + j.current + '</b></span>') : '';
      const cancelBtn = running
        ? '<button class="btn ghost sm" data-cancel="' + j.job_id + '">取消</button>' : '';
      card.querySelector('.job-head').innerHTML =
        badge(j.status) +
        '<span class="job-folders">' + (j.folders || []).join(', ') + '</span>' +
        cur + '<span style="margin-left:auto"></span>' + cancelBtn;
      const cbtn = card.querySelector('[data-cancel]');
      if (cbtn) cbtn.addEventListener('click', async () => {
        cbtn.disabled = true;
        await api('/api/jobs/' + j.job_id + '/cancel', {method:'POST'});
      });
      // 结果链接
      const done = Object.keys(j.results || {});
      const linksEl = card.querySelector('[data-links]');
      linksEl.innerHTML = done.length ? done.map(f => {
        const ok = j.results[f] === 'ok';
        return '<a class="btn sm ' + (ok ? '' : 'ghost') + '" target="_blank" href="/viz.html?folder=' +
          encodeURIComponent(f) + '">' + (ok ? '📊 ' : '⚠ ') + f + ' 结果</a>';
      }).join('') : '';
      // 日志: 原地更新, 保留滚动位置; 若用户已在底部则跟随
      const logEl = card.querySelector('[data-log]');
      const log = (j.stdout || '') + (j.stderr ? ('\n──── stderr ────\n' + j.stderr) : '');
      const atBottom = (logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight) < 40;
      const newText = log || '(暂无输出)';
      if (logEl.textContent !== newText) {
        logEl.textContent = newText;
        if (atBottom || running) logEl.scrollTop = logEl.scrollHeight;
      }
    }

    function jobHtml() { return ''; }  // 保留占位, 已由 renderJobs 增量渲染

    function escapeHtml(s) {
      return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function refreshJobs() {
      const data = await api('/api/jobs');
      const jobs = data.jobs || [];
      renderJobs(jobs);
      return jobs.some(j => j.status === 'running' || j.status === 'queued');
    }

    let jobsTimer = null;
    async function pollJob() {
      if (jobsTimer) return;
      const tick = async () => {
        const active = await refreshJobs();
        if (active) jobsTimer = setTimeout(tick, 1000);
        else { jobsTimer = null; loadFolders(); }
      };
      tick();
    }

    // events
    $('refreshBtn').addEventListener('click', () => { loadFolders(); loadConfig(); });
    $('selectAll').addEventListener('change', (e) => {
      document.querySelectorAll('.fchk').forEach(c => c.checked = e.target.checked);
      updateSelCount();
    });
    $('calibSingleBtn').addEventListener('click', () => createJob(selectedFolders()));
    $('calibBatchBtn').addEventListener('click', () => createJob(selectedFolders()));

    // init
    loadConfig();
    loadFolders();
    refreshJobs().then(a => { if (a) pollJob(); });
    setInterval(loadConfig, 8000);
  </script>
</body>
</html>
